<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supermanager</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#15181d; --mut:#6b7280; --acc:#1f4fd8; --me:#1f4fd8; --line:#e3e6eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151a; --card:#1b1f27; --ink:#e8eaee; --mut:#8b93a1; --acc:#6d95ff; --me:#2d56c9; --line:#2a2f3a; } }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); background:var(--card); font-weight:600; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .m { max-width:85%; padding:10px 14px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; }
  .u { align-self:flex-end; background:var(--me); color:#fff; border-bottom-right-radius:4px; }
  .a { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .e { color:#c62828; }
  form { display:flex; gap:8px; padding:12px; background:var(--card); border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 12px; max-height:120px; }
  textarea:focus, button:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }
  button { font:inherit; font-weight:600; border:0; border-radius:12px; padding:0 18px; background:var(--acc); color:#fff; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<header id="title">Supermanager</header>
<div id="log"><div class="m a">Hola, ¿en qué te ayudo?</div></div>
<form id="f">
  <textarea id="t" rows="1" placeholder="Escribe tu mensaje" required></textarea>
  <button id="b">Enviar</button>
</form>
<script>
  const log = document.getElementById("log"), f = document.getElementById("f"),
        t = document.getElementById("t"), b = document.getElementById("b");
  const history = [];
  fetch("/api/info").then(r => r.json()).then(d => { document.getElementById("title").textContent = d.name; document.title = d.name; }).catch(()=>{});

  function add(cls, text) {
    const d = document.createElement("div");
    d.className = "m " + cls; d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
  }
  t.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } });

  f.addEventListener("submit", async e => {
    e.preventDefault();
    const text = t.value.trim(); if (!text) return;
    t.value = ""; b.disabled = true;
    add("u", text); history.push({ role: "user", content: text });
    const wait = add("a", "Escribiendo…");
    try {
      const r = await fetch("/api/chat", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ messages: history }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Error");
      wait.textContent = d.reply; history.push({ role: "assistant", content: d.reply });
    } catch (err) {
      wait.textContent = "Error: " + err.message; wait.classList.add("e"); history.pop();
    }
    b.disabled = false; t.focus(); log.scrollTop = log.scrollHeight;
  });
</script>
</body>
</html>
